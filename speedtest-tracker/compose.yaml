---
version: "3.3"
services:
  speedtest:
    container_name: speedtest-tracker
    image: henrywhitaker3/speedtest-tracker
    environment:
      - TZ=Asia/Kolkata
      - PGID=2002
      - PUID=2003
      - OOKLA_EULA_GDPR=true
    logging:
      driver: "json-file"
      options:
        max-file: "10"
        max-size: "200k"
    ports:
      - 8765:80
    volumes:
      - /opt/speedtest-tracker/config:/config
    restart: unless-stopped
